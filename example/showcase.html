<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Showcase</title>
        <link rel="stylesheet" href="./styles/common.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #dfe8ef;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            }

            #container {
                width: 100vw;
                height: 100vh;
            }
        </style>
        <script src="./loader.js" data-demo="Showcase"></script>
    </head>
    <body>
        <div id="container"></div>

        <div id="top-notice">
            <div class="credit-line">
                Character Model:
                <a href="https://quaternius.itch.io/universal-animation-library" target="_blank" rel="noopener noreferrer">Universal Animation Library</a>
            </div>
            <div class="credit-line">
                Vehicle:
                <a href="https://sketchfab.com/3d-models/low-poly-cyberpunk-suv-dc48eaca64ee4d628403ca8464964780" target="_blank" rel="noopener noreferrer">Low-poly cyberpunk SUV</a>
            </div>
        </div>

        <div class="hud" data-hint-mode="on-foot" role="note" aria-label="Controls">
            <div class="hint-set" data-for="on-foot">
                <div class="hint-move">
                    <div class="hint-cluster">
                        <div class="wasd">
                            <kbd class="wasd-w">W</kbd>
                            <kbd class="wasd-a">A</kbd>
                            <kbd class="wasd-s">S</kbd>
                            <kbd class="wasd-d">D</kbd>
                        </div>
                        <span class="hint-text">Move</span>
                    </div>
                    <div class="hint-cluster">
                        <div class="hint-mouse" aria-hidden="true">
                            <div class="hint-mouse-body">
                                <span class="hint-mouse-wheel"></span>
                                <span class="hint-mouse-nub"></span>
                            </div>
                        </div>
                        <span class="hint-text">Look</span>
                    </div>
                </div>
                <div class="hint-actions">
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>Shift</kbd></span>
                        <span class="hint-text">Sprint</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>Space</kbd></span>
                        <span class="hint-text">Jump</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>E</kbd></span>
                        <span class="hint-text">Enter</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>V</kbd></span>
                        <span class="hint-text">Toggle View</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>F</kbd></span>
                        <span class="hint-text">Toggle Fly</span>
                    </div>
                </div>
            </div>
            <div class="hint-set" data-for="vehicle">
                <div class="hint-move">
                    <div class="hint-cluster">
                        <div class="wasd">
                            <kbd class="wasd-w">W</kbd>
                            <kbd class="wasd-a">A</kbd>
                            <kbd class="wasd-s">S</kbd>
                            <kbd class="wasd-d">D</kbd>
                        </div>
                        <span class="hint-text">Drive</span>
                    </div>
                    <div class="hint-cluster">
                        <div class="hint-mouse" aria-hidden="true">
                            <div class="hint-mouse-body">
                                <span class="hint-mouse-wheel"></span>
                                <span class="hint-mouse-nub"></span>
                            </div>
                        </div>
                        <span class="hint-text">Look</span>
                    </div>
                </div>
                <div class="hint-actions">
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>Shift</kbd></span>
                        <span class="hint-text">Drift</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>Space</kbd></span>
                        <span class="hint-text">Brake</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>E</kbd></span>
                        <span class="hint-text">Exit</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>V</kbd></span>
                        <span class="hint-text">Toggle View</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>R</kbd></span>
                        <span class="hint-text">Reset Vehicle</span>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="./control-hints.js"></script>
        <script type="module" src="./showcase.js"></script>
        <a class="source" href="https://github.com/hh-hang/three-player-controller/blob/master/example/showcase.js" target="_blank" rel="noopener noreferrer">
            <img src="./img/source.svg" alt="" />
        </a>
    </body>
</html>
